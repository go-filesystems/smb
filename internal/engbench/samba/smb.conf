[global]
	server role = standalone server
	map to guest = never
	server min protocol = SMB3_11
	smb encrypt = required
	server signing = mandatory
	disable netbios = yes
	smb ports = 445
	log level = 1
	load printers = no
	printing = bsd
	printcap name = /dev/null

[data]
	path = /data
	read only = no
	valid users = alice
	force user = alice
